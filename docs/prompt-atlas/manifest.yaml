# manifest.yaml — Machine-readable index of the Prompt Atlas (Kronos Edition)
#
# Minimal loader (Python):
#   import yaml, pathlib
#   m = yaml.safe_load(pathlib.Path("docs/prompt-atlas/manifest.yaml").read_text())
#   for ch in m["chapters"]:
#       prompts = yaml.safe_load(pathlib.Path("docs/prompt-atlas") / ch["prompts"]).read_text())
